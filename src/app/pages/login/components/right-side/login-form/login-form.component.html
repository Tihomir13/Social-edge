<form
  class="d-flex flex-column form"
  [formGroup]="loginForm"
  (ngSubmit)="onSubmit()"
>
  <input
    class="form-control identifier"
    type="text"
    placeholder="Email or username"
    formControlName="loginIdentifier"
  />

  <input
    class="form-control"
    type="password"
    placeholder="Password"
    formControlName="password"
  />

  @if(isErrorMsgShowed) {
  <div class="bg-danger error-message mb-22px">
    {{ errorMsg }}
  </div>
  }

  <div class="d-flex justify-content-between">
    <label class="form-check-label">
      <input
        class="form-check-input"
        type="checkbox"
        id="myCheckbox"
        formControlName="rememberMe"
      />
      Remember Me
    </label>

    <a [routerLink]="['/forgotten-password']" class="forgot-password" > Forgot password? </a>
  </div>


  <button class="btn d-flex justify-content-center align-items-center fs-5 gap-2"
    [class.btn-loading]="isLoading"
    type="submit">Login
    @if (isLoading) {
      <app-loading-spinner [size]="'medium'"/>
    }
  </button>
</form>
