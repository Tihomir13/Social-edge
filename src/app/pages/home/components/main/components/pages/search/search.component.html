<div class="search-container">
  <h1 class="px-2 my-3">Search people</h1>

  <div
    class="profile-cards-container d-flex flex-column gap-2 px-2 px-md-0 gap-md-4"
  >
    @for (user of mainState.searchedUsers(); track $index) {
    <app-user-big-card
      [fullName]="user.name"
      [profileImg]="user.profileImage.src"
      [username]="user.username"
      [currUserProfileName]="this.utility.userInfo.username"
      (clickProfile)="onClickProfile($event)"
      [isFriend]="user.isFriend"
      [isRequested]="user.isRequestedBySender"
      (addFriend)="onAddFriend($event)"
      (removeRequest)="onRemoveFriendRequest($event)"
    />
    }
  </div>

  @if (mainState.isSearchingForPeople()) {
    <div class='w-100 text-center'>
      <app-loading-spinner classes="text-black"/>
    </div>
  }

  @if(this.mainState.searchedUsers().length === 0 && !mainState.isSearchingForPeople()) {
    <div class="text-center mt-5">
      <h4 class="text-secondary">No users found</h4>
    </div>
  }
</div>
