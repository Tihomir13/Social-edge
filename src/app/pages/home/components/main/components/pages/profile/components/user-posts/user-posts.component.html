<div class="user-posts-container">
  @if(isLoadingPosts) {
    <div class="mt-5 text-center">
      <app-loading-spinner classes="text-dark" [size]="enumLoadingSpinnerSize.large"></app-loading-spinner> 
    </div>
  }
  @else { 
    @for (post of posts(); track $index) {
      <app-post
      [username]="post.author.username"
      [authorProfileImg]="post.author.profileImage"
      [images]="post.images"
      [likes]="post.likes"
      [title]="post.title"
      [text]="post.text"
      [tags]="post.tags"
      [postId]="post._id"
      [comments]="post.comments"
      [currUserImg]="mainState.userProfileImg()"
      [totalCommentsCount]="post.commentsCount"
      [totalLikes$]="post.totalLikes"
      [isLikedByCurrUser$]="post.isLiked"
      />
    }
  }
</div>
