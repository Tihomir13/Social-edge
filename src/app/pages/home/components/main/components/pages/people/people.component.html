<div class="people-container">
  <h1 class="px-2 my-3">Suggested Profiles</h1>

  <div class="flex-wrap d-flex gap-4">
    @for (user of people(); track $index) {
    <app-user-big-card [user]="user" class="mt-3" (onAddFriendEmitter)="onAddFriend(user.username)"
      (onRemoveFriendRequestEmitter)="onRemoveFriendRequest(user.username)" />
    }
  </div>

  @if(isLoadingProfiles) {
  <div class="mt-5 text-center">
    <app-loading-spinner classes="text-dark" [size]="enumLoadingSpinnerSize.large"></app-loading-spinner>
  </div>
  }

  @if(people().length === 0 && !isLoadingProfiles) {
  <div class="text-center mt-5">
    <h3 class="text-secondary">No profiles found</h3>
  </div>
  }
</div>
