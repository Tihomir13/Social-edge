<div class="d-flex gap-2 align-items-end">
  <textarea 
    #textarea 
    class="form-control" 
    type="text"
    appAutoResizeChatTextarea
    rows="1">
  </textarea>

  @if (!isTyping) {
    <img class="icon" src="assets/icons/star.svg" 
    alt="star icon" 
    />
  }
  
  @if (isTyping) {
    <img class="icon" src="assets/icons/sent.svg" 
    alt="star icon" 
    (click)="sendMessage()"/>
  }
</div>
