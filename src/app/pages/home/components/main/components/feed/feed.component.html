<div class="feed-container">
  <app-new-post class="app-new-post" (creatingNewPost)="onNewPost()" />

  @for (post of this.state.posts(); track $index) {
  <app-post
    [username]="post.author.username"
    [authorProfileImg]="post.author.profileImage"
    [images]="post.images"
    [likes]="post.likes"
    [title]="post.title"
    [text]="post.text"
    [tags]="post.tags"
    [postId]="post._id"
    [comments]="post.comments"
    [currUserImg]="state.userProfileImg()"
    [totalCommentsCount]="post.commentsCount"
    [totalLikes$]="post.totalLikes"
    [isLikedByCurrUser$]="post.isLiked"
  />
  }
</div>

@if (state.openedPost()) {
<div class="modal-overlay">
  <div class="post-modal-container">
    <app-post-modal
      [username]="state.openedPost().author.username"
      [authorProfileImg]="state.openedPost().author.profileImage"
      [images]="state.openedPost().images"
      [likes]="state.openedPost().likes"
      [title]="state.openedPost().title"
      [text]="state.openedPost().text"
      [tags]="state.openedPost().tags"
      [postId]="state.openedPost()._id"
      [comments]="state.openedPost().comments"
      [currUserImg]="state.userProfileImg()"
      [totalCommentsCount]="state.openedPost().commentsCount"
      [totalLikes$]="state.openedPost().totalLikes"
      [isLikedByCurrUser$]="state.openedPost().isLiked"
      [createdAt]="state.openedPost().createdAt"
    />
  </div>
</div>
}
