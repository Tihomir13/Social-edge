<div class="feed-container">
  <app-new-post class="app-new-post" (creatingNewPost)="onNewPost()" />

  @for (post of this.state.posts(); track $index) {
  <app-post
    [username]="post.author.username"
    [authorProfileImg]="post.author.profileImage.src"
    [images]="post.images"
    [likes]="post.likes"
    [title]="post.title"
    [text]="post.text"
    [tags]="post.tags"
    [postId]="post._id"
    [comments]="post.comments"
    [currUserImg]="state.userProfileImg()"
  />
  }
</div>
