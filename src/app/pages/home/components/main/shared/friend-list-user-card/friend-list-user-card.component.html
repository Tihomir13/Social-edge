<div class="container">
  <div class="row">
    <div class="d-flex align-items-center user-card">
      <div class="position-relative">
        <img class="profile-icon" src="assets/images/image.png" alt="profile-icon" />

        @if (isOnline()) {
          <span class="status-icon bg-success"></span>
        }
        @else {
          <span class="status-icon bg-dark"></span>
        }
      </div>

      <span>{{ username() }}</span>
    </div>
  </div>
</div>
