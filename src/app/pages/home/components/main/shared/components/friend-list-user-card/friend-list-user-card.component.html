<div class="container">
  <div class="row">
    <div class="d-flex align-items-center user-card">
      <div class="position-relative">
        <img class="profile-image" [src]="profileImage()" alt="profile-icon" />

        @if (isOnline()) {
          <span class="status-icon bg-success"></span>
        }
        @else {
          <span class="status-icon bg-dark"></span>
        }

      </div>
      
      @if(newMessage()) {
        <span class="new-notification-icon bg-warning"></span>
      }
      <span>{{ username() }}</span>
    </div>
  </div>
</div>
