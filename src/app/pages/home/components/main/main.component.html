<div class="container-fluid mt-0">
  <div class="row">
    <div class="content">
      <div class="left">
        <app-navigation class="navigation"/>
        <!-- <app-suggested-profiles class="suggested-profiles"/> -->
      </div>

      <div class="general">
        <router-outlet></router-outlet>
      </div>

      <div class="right">
        <app-friend-list
          class="friend-list"
        />

        <app-chat-heads
          class="chat-heads"
          (open)="onProfileClick($event)"
          (close)="onCloseChatHead($event)"
        />

        @if (this.state.isChatActive() && this.state.currChatProfileUser()) {
        <app-chat
          class="chat"
          [currChatUser]="this.state.currChatProfileUser()"
          (minimizeChat)="onMinimizeChat($event)"
        />
        }
      </div>
    </div>
  </div>
</div>
