<div class="spinner-border text-light"
    [class.text-light]="classes() === 'text-light'"
    [class.text-dark]="classes() === 'text-dark'"
    [class.spinner-border-sm]="size() === 'small'"
    [class.spinner-border-md]="size() === 'medium'"
    [class.spinner-border-lg]="size() === 'large'"
    role="status">
    <span class="visually-hidden">Loading...</span>
</div>
